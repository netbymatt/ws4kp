name: lint-build

# check that pull requests pass lint and produce a build, nothing is published
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # matches the Dockerfiles
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
